name: Keep demos awake

on:
  schedule:
    # Every 6 hours; Streamlit Community Cloud sleeps apps after ~12h idle
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Visit the demos
        run: python .github/scripts/keep_awake.py
